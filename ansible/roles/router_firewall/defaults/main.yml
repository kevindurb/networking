---
router_firewall_lan_zone:
  name: lan
  input: ACCEPT
  output: ACCEPT
  forward: ACCEPT
  network:
    - lan

router_firewall_wan_zone:
  name: wan
  input: REJECT
  output: ACCEPT
  forward: REJECT
  masq: '1'
  mtu_fix: '1'
  network:
    - wan
    - wan6

# Lets the tailnet reach the LAN (subnet router) and the router reach the
# tailnet, and lets the router act as an exit node.
router_firewall_tailscale_zone:
  name: tailscale
  input: ACCEPT
  output: ACCEPT
  forward: ACCEPT
  masq: '1'
  mtu_fix: '1'
  network:
    - tailscale

router_firewall_forwardings:
  - src: lan
    dest: wan
  - src: lan
    dest: tailscale
  - src: tailscale
    dest: lan

# These mirror the stock OpenWrt rule set. Matched by name so they update in
# place rather than being duplicated.
router_firewall_rules:
  - name: Allow-DHCP-Renew
    value:
      name: Allow-DHCP-Renew
      src: wan
      proto: udp
      dest_port: '68'
      target: ACCEPT
      family: ipv4
  - name: Allow-Ping
    value:
      name: Allow-Ping
      src: wan
      proto: icmp
      icmp_type: echo-request
      family: ipv4
      target: ACCEPT
  - name: Allow-IGMP
    value:
      name: Allow-IGMP
      src: wan
      proto: igmp
      family: ipv4
      target: ACCEPT
  - name: Allow-DHCPv6
    value:
      name: Allow-DHCPv6
      src: wan
      proto: udp
      dest_port: '546'
      family: ipv6
      target: ACCEPT
  - name: Allow-MLD
    value:
      name: Allow-MLD
      src: wan
      proto: icmp
      src_ip: fe80::/10
      icmp_type:
        - 130/0
        - 131/0
        - 132/0
        - 143/0
      family: ipv6
      target: ACCEPT
  - name: Allow-ICMPv6-Input
    value:
      name: Allow-ICMPv6-Input
      src: wan
      proto: icmp
      icmp_type:
        - echo-request
        - echo-reply
        - destination-unreachable
        - packet-too-big
        - time-exceeded
        - bad-header
        - unknown-header-type
        - router-solicitation
        - neighbour-solicitation
        - router-advertisement
        - neighbour-advertisement
      limit: 1000/sec
      family: ipv6
      target: ACCEPT
  - name: Allow-ICMPv6-Forward
    value:
      name: Allow-ICMPv6-Forward
      src: wan
      dest: '*'
      proto: icmp
      icmp_type:
        - echo-request
        - echo-reply
        - destination-unreachable
        - packet-too-big
        - time-exceeded
        - bad-header
        - unknown-header-type
      limit: 1000/sec
      family: ipv6
      target: ACCEPT
  - name: Allow-IPSec-ESP
    value:
      name: Allow-IPSec-ESP
      src: wan
      dest: lan
      proto: esp
      target: ACCEPT
  - name: Allow-ISAKMP
    value:
      name: Allow-ISAKMP
      src: wan
      dest: lan
      dest_port: '500'
      proto: udp
      target: ACCEPT
