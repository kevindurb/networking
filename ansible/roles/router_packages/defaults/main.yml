---
# Packages that are installed on the router but are not pulled in by the base
# system. `community.openwrt.init` handles the recommended/base set first.
router_packages_list:
  - tailscale
  - luci-app-tailscale-community
  - iperf3
  - speedtest-go
  - miniupnpd-nftables
  - luci-app-upnp
  - luci-app-attendedsysupgrade
  - luci-ssl
  - coreutils
  - coreutils-base64
  - coreutils-md5sum
  - coreutils-sha1sum
  - e2fsprogs

# Leftovers from the retired WireGuard hub setup, replaced by Tailscale
# (removed in commit 46ccadc). kmod-wireguard is deliberately left installed --
# it is a kernel package and removing it has no functional benefit here.
router_packages_absent:
  - wireguard-tools
  - luci-proto-wireguard
