---
# --- Dropbear (SSH) ---------------------------------------------------------
# Password auth is off; only the authorized_keys on the router are accepted.
# Those keys are managed manually (secrets are not stored in this repo).
- name: Configure dropbear
  community.openwrt.uci:
    autocommit: true
    operations:
      - command: set
        key: dropbear.@dropbear[0].Port
        value: "{{ router_services_dropbear_port }}"
      - command: set
        key: dropbear.@dropbear[0].PasswordAuth
        value: 'off'
      - command: set
        key: dropbear.@dropbear[0].RootPasswordAuth
        value: 'off'
  notify: restart dropbear

# --- LuCI / uhttpd ----------------------------------------------------------
- name: Configure uhttpd
  community.openwrt.uci:
    command: set
    config: uhttpd
    section: main
    type: uhttpd
    value:
      listen_http: "{{ router_services_uhttpd_listen_http }}"
      listen_https: "{{ router_services_uhttpd_listen_https }}"
      redirect_https: '1'
      rfc1918_filter: '1'
      home: /www
    autocommit: true
  notify: restart uhttpd

- name: Configure uhttpd certificate defaults
  community.openwrt.uci:
    command: set
    config: uhttpd
    section: defaults
    type: cert
    value:
      days: '730'
      key_type: ec
      bits: '2048'
      ec_curve: P-256
      country: ZZ
      state: Somewhere
      location: Unknown
      commonname: OpenWrt
    autocommit: true
  notify: restart uhttpd

# --- UPnP (miniupnpd) -------------------------------------------------------
- name: Configure upnpd
  community.openwrt.uci:
    command: set
    config: upnpd
    section: config
    type: upnpd
    value:
      enabled: '1'
      download: '1024'
      upload: '512'
      internal_iface: "{{ router_services_upnpd_internal_iface }}"
      port: "{{ router_services_upnpd_port }}"
      upnp_lease_file: /var/run/miniupnpd.leases
      igdv1: '1'
    autocommit: true
  notify: restart miniupnpd

- name: Configure upnpd permission rules
  community.openwrt.uci:
    command: section
    config: upnpd
    type: perm_rule
    find:
      comment: "{{ item.comment }}"
    value: "{{ item }}"
    autocommit: true
  loop: "{{ router_services_upnpd_perm_rules }}"
  loop_control:
    label: "{{ item.comment }}"
  notify: restart miniupnpd

# --- Attended sysupgrade ----------------------------------------------------
- name: Configure attended sysupgrade
  community.openwrt.uci:
    command: set
    config: attendedsysupgrade
    section: server
    type: server
    value:
      url: "{{ router_services_attendedsysupgrade_url }}"
    autocommit: true

- name: Configure attended sysupgrade client
  community.openwrt.uci:
    command: set
    config: attendedsysupgrade
    section: client
    type: client
    value:
      upgrade_packages: '1'
      auto_search: '0'
      advanced_mode: '0'
      login_check_for_upgrades: '1'
    autocommit: true
