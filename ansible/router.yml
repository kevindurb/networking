---
# Provision the home router (OpenWrt 25.12 on generic x86/64).
#
# The router has no Python, so modules are provided by the community.openwrt
# collection (ucode-based) rather than ansible.builtin.*. The `init` role sets
# up the connection/host facts those modules rely on.
#
# Secrets (dropbear authorized_keys, the tailscale auth key) are intentionally
# NOT managed here -- see README.md for the manual steps.
- name: Provision Router
  hosts: router
  gather_facts: false
  roles:
    - community.openwrt.init
    - router_common
    - router_packages
    - router_network
    - router_dhcp
    - router_firewall
    - router_tailscale
    - router_services
